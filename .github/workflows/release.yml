name: Fast Release

# Blocking release path: push to main → changed component images in GHCR →
# refs/deploy-ready → VM poller deploys staging, smokes it, then production.
# Full Verification (verify.yml) runs separately and gates this path only for
# migrations or deployment-infrastructure changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backlog/**'
      - '**/*.md'
      - 'tmp/**'
permissions:
  contents: read
concurrency:
  # Do not cancel an in-flight release: a docs/scripts push must never drop an
  # already built SHA. Monotonic deploy-ready advancement keeps last-wins.
  group: fast-release-main
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      slow: ${{ steps.classify.outputs.slow }}
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed components since the last released SHA
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if ! refs=$(git ls-remote origin refs/deploy-ready 2>/dev/null); then
            echo 'Could not query deploy-ready; refusing to guess a release scope' >&2
            exit 1
          fi
          if test -z "$refs"; then
            # No release baseline yet: publish every component and use the
            # verified slow path for the very first release.
            matrix='["api","gateway","web"]'
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo 'slow=true' >> "$GITHUB_OUTPUT"
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(awk '{print $1}' <<<"$refs")
          git fetch --quiet origin "$base" '+refs/deploy-ready:refs/remotes/origin/deploy-ready'
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files since $base:"
          printf '%s\n' "$changed"
          components=()
          if grep -qE '^apps/web/|^infra/web\.Dockerfile$' <<<"$changed"; then components+=(web); fi
          if grep -qE '^backend/|^infra/(api\.Dockerfile|imagemagick-policy\.xml)$' <<<"$changed"; then components+=(api); fi
          if grep -qE '^infra/(nginx\.conf|gateway\.Dockerfile)$|^deploy/Caddyfile$' <<<"$changed"; then components+=(gateway); fi
          slow=false
          if grep -qE '^(backend/migrations/|deploy/|infra/|\.github/)' <<<"$changed"; then
            slow=true
          fi
          if test "$slow" = true; then
            matrix='[]'
            deploy=true
          else
            if test ${#components[@]} -eq 0; then
              matrix='[]'
              deploy=false
            else
              matrix=$(printf '%s\n' "${components[@]}" | sort -u | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/;s/$/]/')
              deploy=true
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "slow=$slow" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build:
    # Serialize HEAD-tag and alias writers across both publishing workflows.
    concurrency:
      group: component-image-${{ github.repository }}-${{ matrix.component }}
      cancel-in-progress: false
    needs: classify
    if: needs.classify.outputs.matrix != '[]' && !cancelled()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image repository
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - name: Check immutable HEAD image
        id: head-image
        run: |
          status=$(bash scripts/publish-component-alias.sh --head-status "${{ steps.image.outputs.repository }}" "${{ github.sha }}")
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.head-image.outputs.status == 'missing'
        with:
          context: .
          file: infra/${{ matrix.component }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Publish immutable component input alias
        run: bash scripts/publish-component-alias.sh "${{ matrix.component }}" "${{ steps.image.outputs.repository }}" "${{ github.sha }}"

  verify-gate:
    needs: classify
    if: needs.classify.outputs.slow == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Full Verification of this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            if run=$(gh api "repos/$REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$SHA&event=push&per_page=20" 2>/dev/null \
              | jq -c --arg sha "$SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // {}'); then
              status=$(jq -r '.status // "missing"' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              if test "$status" = completed; then
                test "$conclusion" = success || {
                  echo "Full Verification concluded $conclusion for $SHA" >&2; exit 1;
                }
                echo "Full Verification passed for $SHA"
                exit 0
              fi
            else
              echo 'Transient GitHub API error while waiting for verification; retrying'
            fi
            sleep 20
          done
          echo "Timed out waiting for Full Verification of $SHA" >&2
          exit 1

  advance:
    needs: [classify, build, verify-gate]
    if: >-
      needs.classify.outputs.deploy == 'true' && !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.verify-gate.result == 'success' || needs.verify-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Advance deploy-ready
        run: bash scripts/advance-deploy-ready.sh "${{ github.sha }}"
