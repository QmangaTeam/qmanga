name: Verify Qmanga
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Check locked Backlog data
        run: |
          bun install --frozen-lockfile
          bun run backlog doctor
      - name: Check setup and create isolated configuration
        shell: pwsh
        run: |
          ./scripts/test-setup.ps1
          ./scripts/test-go-test-events.ps1
          ./scripts/setup.ps1 -ProjectName qmanga-ci
          ./scripts/check-compose.ps1
      - name: Check shell setup
        run: sh scripts/test-setup.sh
      - name: Check deployment definitions
        run: |
          set -euo pipefail
          bash -n deploy/*.sh
          bash scripts/test-internal-staging-route.sh
          bash scripts/test-offsite-oci.sh
          export RELEASE_SHA=0123456789abcdef0123456789abcdef01234567 GATEWAY_PORT=18280 DEPLOY_TARGET=staging
          docker compose --env-file deploy/host.env.example -f deploy/compose.data.yaml config --quiet
          docker compose --env-file deploy/host.env.example -f deploy/compose.app.yaml config --quiet
          docker compose -f deploy/compose.front.yaml config --quiet
          docker run --rm -v "$PWD/deploy:/etc/caddy/config:ro" -v "$PWD/deploy:/etc/caddy/sites:ro" \
            caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/config/Caddyfile --adapter caddyfile
      - name: Cold start and web build checks
        run: docker compose --parallel 1 up -d --build --wait --wait-timeout 180
      - name: Online backup and avatar deletion guard regression
        env:
          QMANGA_TEST_ENV_FILE: ${{ github.workspace }}/.env
          QMANGA_TEST_PROJECT: qmanga-ci
        run: bash scripts/test-backup-guard.sh
      - name: Go unit, PostgreSQL and real codec tests without hidden skips
        shell: pwsh
        run: |
          docker compose --profile tools run --rm go-tests go test ./... -count=1 -json > tmp-go-tests.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content tmp-go-tests.jsonl -Tail 40; throw 'Go suite failed' }
          ./scripts/check-go-test-events.ps1 -Path tmp-go-tests.jsonl
      - name: Auth, publishing and reading acceptance
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1
          go run scripts/create-smoke-pages.go tmp/ci/pages
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          ./scripts/smoke-publishing.ps1 -SourceDirectory tmp/ci/pages -PageLimit 3 -ProjectName qmanga-ci -ConfirmRights -SourceNote 'Synthetic geometric pages generated by scripts/create-smoke-pages.go; no third-party artwork.' -Credits 'Qmanga acceptance tooling' -ResultFile tmp/ci/fixture.json
          $fixture = Get-Content tmp/ci/fixture.json -Raw | ConvertFrom-Json
          ./scripts/smoke-reading.ps1 -ReleaseId $fixture.release_id
      - name: Install browser test dependencies
        run: |
          docker run --rm --mount "type=bind,source=$PWD/apps/web,target=/app" -w /app oven/bun@sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373 bun install --frozen-lockfile
          node apps/web/node_modules/playwright/cli.js install --with-deps chromium
      # The smoke phase shares an in-memory per-IP auth budget with browser tests.
      # Recreate only the same API image: retain sessions, fixture data and private media.
      - name: Isolate browser auth budget and verify API restart
        run: docker compose up -d --force-recreate --no-deps --no-build --pull never --wait --wait-timeout 120 api
      # Browser files share one API/IP and its real auth limiter; run files serially.
      # Keep real login paths and production limits, rather than synthesizing sessions.
      - name: Browser integration and interaction regressions
        working-directory: apps/web
        env:
          QMANGA_FIXTURE_FILE: ${{ github.workspace }}/tmp/ci/fixture.json
        shell: bash
        run: |
          # A fast runner can exceed the real 30/minute IP budget even serially.
          # Separate disposable test groups; never relax production auth limits.
          files=(tests/browser/*.test.mjs)
          for ((offset=0; offset<${#files[@]}; offset+=8)); do
            if ((offset>0)); then
              (cd ../.. && docker compose up -d --force-recreate --no-deps --no-build --pull never --wait --wait-timeout 120 api)
            fi
            node --test --test-concurrency=1 "${files[@]:offset:8}"
          done
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 60 api worker web gateway
      - name: Stop test environment
        if: always()
        run: docker compose down --remove-orphans

  publish-images:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: local-acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, gateway]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.component }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.QMANGA_STAGING_ENABLED == 'true'
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    concurrency:
      group: qmanga-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy tested images to staging
        env:
          DEPLOY_HOST: ${{ vars.QMANGA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.QMANGA_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.QMANGA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.QMANGA_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/qmanga_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qmanga_deploy" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/qmanga_deploy" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/qmanga/repo/deploy/release.sh staging $RELEASE_SHA"
