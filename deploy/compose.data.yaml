services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: qmanga
      POSTGRES_USER: qmanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmanga -d qmanga"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [data]
  minio:
    image: qmanga-minio:local
    pull_policy: never
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [data]
volumes:
  postgres-data:
    name: qmanga-${DEPLOY_TARGET:?set DEPLOY_TARGET}-postgres
  minio-data:
    name: qmanga-${DEPLOY_TARGET:?set DEPLOY_TARGET}-minio
networks:
  data:
    name: qmanga-${DEPLOY_TARGET:?set DEPLOY_TARGET}-data
