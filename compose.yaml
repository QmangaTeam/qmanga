name: qmanga
services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: qmanga
      POSTGRES_USER: qmanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmanga -d qmanga"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run scripts/setup first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run scripts/setup first}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PORT: "8080"
      DATABASE_URL: postgres://qmanga:${POSTGRES_PASSWORD}@postgres:5432/qmanga?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: qmanga-media
      S3_BUCKET_SOURCE: qmanga-source
      S3_USE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://127.0.0.1:3000/')).ok) process.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
  go-tests:
    profiles: ["tools"]
    image: golang@sha256:f92b6ef800e499660581efdabdf25d9d817a9d124eaf900924f0504e7e27e12d
    working_dir: /src
    volumes: ["./backend:/src", "go-modules:/go/pkg/mod", "go-cache:/root/.cache/go-build"]
    environment:
      TEST_DATABASE_URL: postgres://qmanga:${POSTGRES_PASSWORD}@postgres:5432/qmanga?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    command: ["go", "test", "./...", "-count=1"]
  gateway:
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
  go-modules:
  go-cache:

