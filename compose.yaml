name: qmanga
x-api-image: &api-image
  image: ${COMPOSE_PROJECT_NAME:-qmanga}-api:local
  pull_policy: build
  build:
    context: .
    dockerfile: infra/api.Dockerfile
services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: qmanga
      POSTGRES_USER: qmanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmanga -d qmanga"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run scripts/setup first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run scripts/setup first}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *api-image
    environment: &api-environment
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PORT: "8080"
      DATABASE_URL: postgres://qmanga:${POSTGRES_PASSWORD}@postgres:5432/qmanga?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: qmanga-media
      S3_BUCKET_SOURCE: qmanga-source
      S3_USE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@qmanga.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      API_INTERNAL_URL: http://api:8080
      BUILD_VERSION: ${BUILD_VERSION:-local}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bun", "-e", "if (!(await fetch('http://127.0.0.1:3000/')).ok) process.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *api-image
    environment: *api-environment
    entrypoint: ["/usr/local/bin/qmanga-worker"]
    depends_on:
      api: {condition: service_healthy}
    volumes: [worker-temp:/tmp]
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s
  web-ui:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      target: build
    working_dir: /app
    volumes: ["./apps/web:/app", "/app/node_modules"]
    ports: ["127.0.0.1:3001:3001"]
    command: ["bun", "run", "ui:preview", "--host", "0.0.0.0"]
  mailpit:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: "1000:1000"
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    restart: unless-stopped
  go-tests:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/tests.Dockerfile
    working_dir: /src
    volumes: ["./backend:/src", "go-modules:/go/pkg/mod", "go-cache:/root/.cache/go-build"]
    environment:
      TEST_DATABASE_URL: postgres://qmanga:${POSTGRES_PASSWORD}@postgres:5432/qmanga?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    command: ["go", "test", "./...", "-count=1"]
  gateway:
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped
volumes:
  worker-temp:
  postgres-data:
  minio-data:
  go-modules:
  go-cache:

