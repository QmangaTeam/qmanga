version: "3.8"
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: qmanga
      POSTGRES_PASSWORD: qmanga
      POSTGRES_DB: qmanga
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://qmanga:qmanga@postgres:5432/qmanga?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  minio-data:
