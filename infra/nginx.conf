worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    log_format qmanga '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout qmanga;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 3s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        server_tokens off;
        client_max_body_size 26m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        set $api_endpoint api:8080;
        set $web_endpoint web:3000;
        location /api/ {
            proxy_pass http://$api_endpoint;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
        location /media/ {
            proxy_pass http://$api_endpoint;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / {
            proxy_pass http://$web_endpoint;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

